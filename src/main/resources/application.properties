server.port=8080

# Your real MySQL password goes in a file named application-local.properties
# (project root, next to pom.xml). That file is NOT uploaded to GitHub.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering_v2_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (secret must be at least 32 characters)
app.jwt.secret=change-this-to-a-long-random-secret-key-12345
app.jwt.expiration-ms=86400000

server.error.include-message=always
